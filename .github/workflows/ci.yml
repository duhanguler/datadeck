name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php-quality:
    name: PHP 8.1+ (PHPUnit & WPCS)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.1', '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer test:unit
      - run: composer lint:php
      - run: composer stan

  js-build-and-budget:
    name: TypeScript, JS Tests, Webpack & Bundle Gate (<45KB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:js
      - run: npm run build
      - run: npm run check:budget
